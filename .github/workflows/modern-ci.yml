name: Modern WordFlow CI
on:
  push:
    branches: [modernization]
  pull_request:
    branches: [modernization, main]
    paths: ['modern/**', '.github/workflows/modern-ci.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
