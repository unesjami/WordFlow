  <style>html.wf-booting{background:#f7f8fa}html.wf-booting body{visibility:hidden;transition:none!important}@media(prefers-color-scheme:dark){html.wf-booting{background:#111817;color-scheme:dark}}html.wf-booting *,html.wf-booting *::before,html.wf-booting *::after{animation:none!important;transition:none!important}.wf-header-actions[hidden]{display:none!important}

.wf-setting-value{flex:none;font-size:.73rem;font-weight:600;padding:5px 9px;border-radius:7px;background:var(--accent-soft);color:var(--ink)}
.wf-network-value{color:var(--ink)!important}
.wf-setting-guest{display:grid;gap:4px;flex:1;min-width:0}

@media(prefers-reduced-motion:reduce){#view-settings *{transition:none!important}}

#view-settings .wf-theme-row{flex-wrap:wrap}#view-settings .wf-theme-selector{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:3px;border:1px solid var(--border);border-radius:11px;background:var(--bg);flex:1 0 100%}#view-settings .wf-theme-selector .wf-theme-choice{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;padding:7px 6px;border:1px solid transparent;background:transparent;color:var(--ink-soft);border-radius:8px;font-size:.78rem;transition:background .15s,color .15s}#view-settings .wf-theme-choice[aria-pressed=true]{background:var(--card-bg);border-color:var(--border);color:var(--accent);box-shadow:0 1px 3px #0001}#view-settings .wf-theme-choice:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#view-settings .wf-theme-selector{position:relative;isolation:isolate;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:4px;border:1px solid var(--border);border-radius:999px;background:var(--bg);flex:1 0 100%;--theme-index:0}
#view-settings .wf-theme-thumb{position:absolute;z-index:0;pointer-events:none;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);transform:translateX(calc(var(--theme-index)*100%));border-radius:999px;background:var(--accent);box-shadow:0 2px 7px #0002;transition:transform 260ms cubic-bezier(.22,.8,.25,1),background 160ms ease}
#view-settings .wf-theme-selector .wf-theme-choice{position:relative;z-index:1;min-height:38px;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 6px;border:0;background:transparent;color:var(--ink-soft);border-radius:999px;font-size:.78rem;font-weight:600;box-shadow:none;transition:color 180ms ease}
#view-settings .wf-theme-selector .wf-theme-choice[aria-pressed=true]{background:transparent;border:0;color:var(--on-accent,#fff);box-shadow:none}
#view-settings .wf-theme-choice .lucide{width:16px;height:16px;flex-shrink:0}
#view-settings .wf-theme-choice:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(prefers-reduced-motion:reduce){#view-settings .wf-theme-thumb,#view-settings .wf-theme-choice{transition:none!important}}
#view-settings .wf-theme-selector{grid-template-columns:repeat(3,minmax(0,1fr));align-items:stretch;justify-items:stretch;direction:ltr}#view-settings .wf-theme-selector .wf-theme-choice{box-sizing:border-box;width:100%;min-width:0;max-width:none;margin:0;padding:8px 4px;justify-self:stretch;display:flex;align-items:center;justify-content:center;text-align:center;gap:7px;line-height:1.2}#view-settings .wf-theme-choice>svg{display:block;width:16px;height:16px;flex:0 0 16px;margin:0}#view-settings .wf-theme-choice>span{display:block;margin:0;padding:0;white-space:nowrap;text-align:center}#view-settings .wf-theme-thumb{width:calc((100% - 8px)/3)}
.wf-backup-symbol{display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;border-radius:11px;color:var(--accent);background:var(--accent-soft)}#view-today .wf-auth-hint{display:flex;flex-direction:row;align-items:center;gap:10px;border-color:var(--border);background:var(--card-bg);border-radius:12px}.wf-auth-hint-copy{flex:1}.wf-auth-hint-actions .primary{white-space:nowrap;min-height:36px!important}.wf-auth-hint[hidden]{display:none!important}@media(max-width:480px){#view-today .wf-auth-hint{flex-wrap:wrap}.wf-auth-hint-actions{margin-left:auto}}
</style>

  <link rel="icon" type="image/svg+xml" href="./icon.svg?v=4">

  <meta name="theme-color" content="#146464">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WordFlow — English ⇄ Persian Vocabulary Trainer</title>
  <meta name="description" content="A simple bilingual vocabulary trainer for English and Persian — type or speak a word, get an instant translation, and memorize it with flashcards.">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #FAFAF8;
      --ink: #1E1E1C;
      --ink-soft: #6b675e;
      --ink-faint: #a19d92;
      --accent: #146464;
      --accent-soft: #E9F1EF;
      --gold: #b9860f;
      --border: #E7E4DC;
      --card-bg: #FFFFFF;
      --danger: #a63b34;
    }
    body.dark-mode {
      --bg: #14181A;
      --ink: #ECE9E1;
      --ink-soft: #9CA0A0;
      --ink-faint: #5c6260;
      --accent: #4FD1C0;
      --accent-soft: #1C2626;
      --gold: #E0B84B;
      --border: #262B2C;
      --card-bg: #1A1F21;
      --danger: #e18178;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      transition: background 0.2s ease, color 0.2s ease;
    }
    ::selection { background: var(--accent); color: var(--bg); }

    .shell {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 1.25rem;
    }

    /* ---------- header ---------- */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 0 1rem 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0.9rem;
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; }
    .brand-mark {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.9rem;
      flex-shrink: 0;
    }
    .brand-text h1 { font-weight: 700; font-size: 1.1rem; letter-spacing: -0.01em; line-height: 1.1; }
    .brand-text p { font-size: 0.68rem; color: var(--ink-faint); margin-top: 0.15rem; }

    .dark-toggle {
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      cursor: pointer;
      font-size: 1rem;
    }
    .dark-toggle:hover { border-color: var(--accent); }

    /* ---------- mode row ---------- */
    .mode-row {
      display: flex;
      justify-content: center;
      margin-bottom: 0.8rem;
    }
    .segmented {
      display: flex;
      gap: 0.15rem;
      background: var(--card-bg);
      padding: 0.2rem;
      border-radius: 30px;
      border: 1px solid var(--border);
    }
    .seg-btn {
      background: transparent;
      border: none;
      padding: 0.4rem 1.1rem;
      border-radius: 30px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--ink-soft);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .seg-btn.active { background: var(--accent); color: var(--bg); }

    /* ---------- stage ---------- */
    .word-stage { flex: 1; width: 100%; display: flex; flex-direction: column; min-height: 0; }
    .page { display: none; width: 100%; height: 100%; flex-direction: column; }
    .page.active-page { display: flex; }

    .word-flow {
      width: 100%;
      overflow-y: auto;
      padding: 0.1rem 0.05rem 1rem 0.05rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .word-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.75rem 0.9rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: border 0.15s;
    }
    .word-item:hover { border-color: var(--accent); }

    @keyframes wordPop { 0% { opacity: 0.4; } 100% { opacity: 1; } }
    .word-highlight { animation: wordPop 0.3s ease-out; }

    .word-main { display: flex; flex-direction: column; gap: 0.3rem; flex: 1; min-width: 0; }
    .en-word { font-weight: 500; font-size: 0.98rem; color: var(--ink); word-break: break-word; }
    .fa-word {
      font-weight: 400; font-size: 0.93rem;
      direction: rtl;
      font-family: 'Vazirmatn', sans-serif;
      color: var(--ink-soft);
      word-break: break-word;
      line-height: 1.6;
    }
    .text-sm { font-size: 0.83rem !important; }

    .empty-message {
      color: var(--ink-faint);
      padding: 2.5rem 1rem;
      text-align: center;
      font-size: 0.85rem;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    .icon-group { display: flex; gap: 0.1rem; align-items: center; flex-shrink: 0; }
    .icon-btn {
      width: 28px; height: 28px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 7px;
      font-size: 14px;
      color: var(--ink-soft);
      cursor: pointer;
      background: transparent;
      border: none;
      transition: background 0.12s, color 0.12s;
    }
    .icon-btn:hover { background: var(--accent-soft); color: var(--accent); }
    .delete-btn { color: var(--danger); }
    .delete-btn:hover { background: rgba(166,59,52,0.1); color: var(--danger); }

    /* ---------- flashcard mode ---------- */
    .card-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem 0;
    }
    .progress-text { font-size: 0.72rem; color: var(--ink-faint); font-weight: 600; }

    .flip-card {
      width: 100%;
      max-width: 380px;
      height: 220px;
      perspective: 1200px;
      cursor: pointer;
    }
    .flip-card-inner {
      position: relative;
      width: 100%; height: 100%;
      transition: transform 0.45s;
      transform-style: preserve-3d;
    }
    .flip-card.flipped .flip-card-inner { transform: rotateY(180deg); }
    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      gap: 0.5rem;
    }
    .flip-face-back { transform: rotateY(180deg); }
    .flip-word { font-size: 1.3rem; font-weight: 600; word-break: break-word; }
    .flip-face-back .flip-word { direction: rtl; font-family: 'Vazirmatn', sans-serif; }
    .flip-hint { font-size: 0.65rem; color: var(--ink-faint); }

    .card-controls { display: flex; align-items: center; gap: 0.5rem; }
    .card-controls .icon-btn { width: 34px; height: 34px; font-size: 16px; background: var(--card-bg); border: 1px solid var(--border); }
    .nav-btn { font-weight: 700; }

    /* ---------- status line ---------- */
    .status-line { display: flex; justify-content: center; align-items: center; gap: 0.6rem; min-height: 1.8rem; margin: 0.3rem 0; }
    .loading, .error-message, .toast {
      display: none; align-items: center; gap: 0.4rem;
      background: var(--accent-soft);
      padding: 0.22rem 0.9rem;
      border-radius: 30px;
      font-size: 0.68rem;
      color: var(--accent);
      border: 1px solid var(--border);
      font-weight: 600;
    }
    .error-message { background: rgba(166,59,52,0.08); color: var(--danger); }
    .loading.show, .error-message.show, .toast.show { display: inline-flex; }

    .spinner {
      width: 10px; height: 10px;
      border: 2px solid var(--accent);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ---------- bottom input bar ---------- */
    .input-panel-bottom {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      padding: 0.5rem 0 1.2rem 0;
    }
    .small-input {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 0.25rem 0.25rem 0.25rem 1.1rem;
      display: inline-flex;
      align-items: center;
      flex: 1;
      min-width: 220px;
      max-width: 420px;
      transition: border 0.15s;
    }
    .small-input:focus-within { border-color: var(--accent); }
    #wordInput {
      background: transparent;
      border: none;
      padding: 0.5rem 0.2rem;
      font-size: 0.92rem;
      color: var(--ink);
      outline: none;
      width: 140px;
      flex: 1;
      font-family: 'Inter', sans-serif;
    }
    #wordInput::placeholder { color: var(--ink-faint); font-size: 0.8rem; }

    .mic-btn { color: var(--ink-soft); }
    .mic-btn.listening { color: var(--danger); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    .mic-lang {
      display: flex; gap: 0.1rem;
      background: var(--accent-soft);
      border-radius: 20px;
      padding: 0.1rem;
      margin-right: 0.2rem;
    }
    .mic-lang button {
      border: none; background: transparent;
      font-size: 0.6rem; font-weight: 700;
      padding: 0.2rem 0.45rem;
      border-radius: 20px;
      color: var(--ink-soft);
      cursor: pointer;
    }
    .mic-lang button.active { background: var(--accent); color: var(--bg); }

    .translate-btn {
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 40px;
      padding: 0.6rem 1.1rem;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .translate-btn:hover { background: var(--accent-strong, var(--accent)); opacity: 0.9; }
    .translate-btn:disabled { opacity: 0.5; cursor: default; }

    footer.site-footer {
      text-align: center;

<script>(()=>{let mode='system';try{mode=localStorage.getItem('wf-appearance')||'system';}catch{}const dark=mode==='dark'||(mode!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('dark-mode',dark);document.documentElement.style.colorScheme=dark?'dark':'light';document.documentElement.style.background=dark?'#111817':'#f7f8fa';})();</script>
<div class="shell">

  <header class="site-header">
    <div class="brand">
      <img class="brand-mark" src="./icon.svg" width="38" height="38" alt="" decoding="async">
      <div class="brand-text">
        <h1>WordFlow</h1>
        <p>Your personal vocabulary workspace</p>
      </div>
    </div>
    <div class="dark-toggle" id="darkModeToggle" hidden aria-hidden="true"></div>
  </header>

  <div class="mode-row">
    <div class="segmented" id="pageSwitch">
      <button class="seg-btn active" data-page="mainPage">Active</button>
      <button class="seg-btn" data-page="keptPage">Kept</button>
      <button class="seg-btn" data-page="cardsPage">Cards</button>
    </div>
  </div>

  <div class="word-stage">
    <div class="page active-page" id="mainPage">
      <div class="word-flow" id="listInner"></div>
    </div>
    <div class="page" id="keptPage">
      <div class="word-flow" id="keptListInner"></div>
    </div>
    <div class="page" id="cardsPage">
      <div class="card-stage" id="cardStage">
        <div class="progress-text" id="cardProgress">0 / 0</div>
        <div class="flip-card" id="flipCard">
          <div class="flip-card-inner">
            <div class="flip-face flip-face-front">
              <div class="flip-word" id="flipFront">—</div>
              <div class="flip-hint">tap to reveal</div>
            </div>
            <div class="flip-face flip-face-back">
              <div class="flip-word" id="flipBack">—</div>
              <div class="flip-hint">tap to hide</div>
            </div>
          </div>
        </div>
        <div class="card-controls">
          <button class="icon-btn nav-btn" id="cardPrev" title="previous">‹</button>
          <button class="icon-btn" id="cardSpeak" title="listen">🔊</button>
          <button class="icon-btn" id="cardKeep" title="keep">✔</button>
          <button class="icon-btn nav-btn" id="cardNext" title="next">›</button>
        </div>
      </div>
    </div>
  </div>

  <div class="status-line">
    <div class="loading" id="loadingIndicator"><div class="spinner"></div><span>translating…</span></div>
    <div class="error-message" id="errorMessage"></div>
    <div class="toast" id="toastMessage"></div>
  </div>

  <div class="input-panel-bottom">
    <div class="small-input">
      <div class="mic-lang" id="micLang">
        <button data-lang="en-US" class="active" title="Voice input in English">EN</button>
        <button data-lang="fa-IR" title="Voice input in Persian">FA</button>
      </div>
      <button class="icon-btn mic-btn" id="micBtn" title="Speak a word">🎤</button>
      <input type="text" id="wordInput" placeholder="Type a word or phrase" aria-label="Word or phrase to translate" autocomplete="off">
    </div>
    <button class="translate-btn" id="translateBtn">Translate ↵</button>
  </div>

  <footer class="site-footer">WordFlow · built by Unes Jami</footer>
</div>

    async function translateWithAPI(text, source, target) {

        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${source}&tl=${target}&dt=t&q=${encodeURIComponent(cleanText)}`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (data && data[0]) {
          let fullTranslation = '';
          for (let i = 0; i < data[0].length; i++) {
            if (data[0][i] && data[0][i][0]) fullTranslation += data[0][i][0];
          }
          if (fullTranslation) return fullTranslation;
        }
      } catch (e) { console.log('Google Translate failed, trying backup...', e); }

      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanText)}&langpair=${source}|${target}`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (data.responseStatus === 200 && data.responseData?.translatedText) return data.responseData.translatedText;
      } catch (e) { console.log('MyMemory failed'); }

      try {
        const url = `https://lingva.ml/api/v1/${source}/${target}/${encodeURIComponent(cleanText)}`;
        const resp = await fetch(url);
        const data = await resp.json();
        if (data && data.translation) return data.translation;
      } catch (e) { console.log('Lingva failed'); }

      throw new Error('All translation services failed');
    }

      }catch(e){cloudLabel('Account service unavailable offline');if(!cloudUser){account.hidden=false;headerActions.hidden=false;}}
    })();
    tagTrigger.querySelector('[data-lucide="list-filter"]')?.insertAdjacentHTML('beforebegin',glyph('filter'));tagTrigger.querySelector('[data-lucide="list-filter"]')?.remove();const arrow=tagTrigger.querySelector('[data-lucide="chevron-down"]');if(arrow){arrow.insertAdjacentHTML('beforebegin',glyph('down'));arrow.previousElementSibling.classList.add('wf-chevron');arrow.remove();}
    // Reveal only the finished interface, after routing, theme and layout are ready.
    cancelAnimationFrame(fitFrame);
    fitWorkspace();
    document.documentElement.classList.remove('wf-booting');
  })();
</script>
<script>
if(document.documentElement.classList.contains('wf-booting')){
  document.body.replaceChildren();
  const recovery=document.createElement('main');recovery.style.cssText='max-width:440px;margin:15vh auto;padding:24px;font:16px system-ui;color:var(--ink)';
  const heading=document.createElement('h2');heading.textContent='WordFlow could not start';
  const text=document.createElement('p');text.textContent='Your saved words have not been cleared. Reload to try again.';
  const retry=document.createElement('button');retry.textContent='Reload';retry.style.cssText='margin-top:16px;padding:10px 18px';retry.onclick=()=>location.reload();
  recovery.append(heading,text,retry);document.body.append(recovery);document.documentElement.classList.remove('wf-booting');
}
</script>
</body>
</html>
